<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - Aegon</title>
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#141e30,#243b55);
font-family:Arial;
}
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:40px;
border-radius:12px;
width:320px;
box-shadow:0 0 25px rgba(0,0,0,0.5);
color:white;
text-align:center;
}
.brand{
font-size:26px;
font-weight:bold;
margin-bottom:5px;
letter-spacing:1px;
}
.tagline{
font-size:13px;
opacity:0.7;
margin-bottom:25px;
}
.error-msg {
    background: rgba(231, 76, 60, 0.15);
    border-left: 4px solid #e74c3c;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 6px;
    font-size: 14px;
}
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:6px;
}
button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#00c6ff;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}
button:hover{
background:#0072ff;
}
a{
color:#ccc;
text-decoration:none;
font-size:14px;
}
a:hover{
color:white;
}
</style>
</head>
<body>
<div class="card">

<div class="brand">AEGON</div>
<div class="tagline">Secure Document Protection Platform</div>

{% if error %}
<div class="error-msg">{{ error }}</div>
{% endif %}

<form method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<a href="/register">Create Account</a>

</div>
</body>
</html>
