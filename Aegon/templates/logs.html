<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>System Logs</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #141e30, #243b55);
    font-family: Arial;
    color: white;
    padding: 40px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
}

th, td {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    text-align: left;
}

th {
    background: rgba(0,0,0,0.3);
}

tr:hover {
    background: rgba(0,0,0,0.4);
}

h2 {
    margin-bottom: 20px;
}
</style>
</head>

<body>

<h2>SecureShare Activity Logs</h2>

<table>
<tr>
    <th>User</th>
    <th>File</th>
    <th>Action</th>
    <th>Timestamp</th>
</tr>

{% for log in logs %}
<tr>
    <td>{{log[0]}}</td>
    <td>{{log[1]}}</td>
    <td>{{log[2]}}</td>
    <td>{{log[3]}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
