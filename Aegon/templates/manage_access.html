<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Manage Access - Aegon</title>
<style>
body{
margin:0;
background:linear-gradient(135deg,#141e30,#243b55);
font-family:Arial;
color:white;
padding:40px;
}
.card{
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:12px;
width:600px;
margin:auto;
}
.user-item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,0.1);
}
button{
background:#e74c3c;
border:none;
padding:6px 12px;
border-radius:6px;
color:white;
cursor:pointer;
}
a{
color:#00c6ff;
text-decoration:none;
}
</style>
</head>
<body>

<div class="card">
<h2>Manage Access — {{filename}}</h2>

{% if users %}
{% for user in users %}
<div class="user-item">
<div style="display:flex; flex-direction:column; gap:4px">
    <span><strong>{{user[0]}}</strong></span>
    <span style="font-size:12px; color:#aaa;">
        {% if user[1] %}
            Expires: {{user[1]}}
        {% else %}
            No Expiry
        {% endif %}
    </span>
</div>
<form action="/revoke_access/{{filename}}/{{user[0]}}" method="POST">
<button>Revoke</button>
</form>
</div>
{% endfor %}
{% else %}
<p>No users have access.</p>
{% endif %}

<br>
<a href="/dashboard">← Back to Dashboard</a>

</div>

</body>
</html>
